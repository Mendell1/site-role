name: Apply Google OAuth integration

on:
  push:
    branches: [main]
    paths:
      - '.github/google-oauth-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch auth and pages
        shell: python
        run: |
          from pathlib import Path

          def patch_html(path):
              p = Path(path)
              s = p.read_text(encoding='utf-8')

              if 'css/google-auth.css' not in s:
                  marker = '<link rel="stylesheet" href="css/mobile-responsive.css">'
                  if marker not in s:
                      marker = '<link rel="stylesheet" href="css/estilo.css">'
                  s = s.replace(marker, marker + '\n<link rel="stylesheet" href="css/google-auth.css">', 1)

              if 'js/google-auth.js' not in s:
                  marker = '<script src="js/auth.js"></script>'
                  s = s.replace(marker, marker + '\n<script src="js/google-auth.js"></script>', 1)

              p.write_text(s, encoding='utf-8')

          p = Path('js/auth.js')
          s = p.read_text(encoding='utf-8')

          if 'cadastro_completo === false' not in s:
              old = "    if(!this.usuario || !this.perfil) return false;\n    if(this.perfil.bloqueado) return false;"
              new = "    if(!this.usuario || !this.perfil) return false;\n    if(this.perfil.cadastro_completo === false) return false;\n    if(this.perfil.bloqueado) return false;"
              if old not in s:
                  raise SystemExit('Não foi possível localizar Sessao.ativa em js/auth.js')
              s = s.replace(old, new, 1)

          if 'termos_aceitos_em, cadastro_completo, notif_eventos' not in s:
              old = 'termos_versao, termos_aceitos_em, notif_eventos'
              new = 'termos_versao, termos_aceitos_em, cadastro_completo, notif_eventos'
              if old not in s:
                  raise SystemExit('Não foi possível localizar select do perfil em js/auth.js')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          patch_html('index.html')
          patch_html('perfil.html')

      - name: Commit Google OAuth integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html perfil.html js/auth.js js/google-auth.js css/google-auth.css supabase/migrations/20260904040500_google_oauth_onboarding.sql
          git rm .github/google-oauth-trigger.txt .github/workflows/apply-google-oauth.yml
          git commit -m "feat: add secure Google sign-in flow"
          git push origin main
