name: Apply V24 consolidation

on:
  push:
    paths:
      - '.github/workflows/apply-v24-consolidation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V24 patch
        run: python tools/apply_v24.py
      - name: Refine smoke rule and patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          antigo = """config = read('js/config.js').lower()\nassert 'service_role' not in config\nassert 'sb_secret_' not in config"""
          novo = """config = read('js/config.js').lower()\nfor linha in config.splitlines():\n    if '=' not in linha:\n        continue\n    assert 'service_role' not in linha, 'service_role atribuído no frontend'\n    assert 'sb_secret_' not in linha, 'chave secreta atribuída no frontend'"""
          for nome in ['tests/smoke.py','tools/apply_v24.py']:
              p=Path(nome)
              s=p.read_text(encoding='utf-8')
              if antigo in s:
                  s=s.replace(antigo,novo,1)
              if nome=='tools/apply_v24.py' and '\n# 9) CI simples' in s:
                  s=s.split('\n# 9) CI simples',1)[0].rstrip()+"\n\nprint('V24 repository patch prepared.')\n"
              p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/ci.yml
      - name: Validate JavaScript
        run: for f in js/*.js; do node --check "$f"; done
      - name: Run smoke tests
        run: python tests/smoke.py
      - name: Commit V24
        run: |
          git config user.name "Mendell1"
          git config user.email "matias3.wendell@gmail.com"
          git add index.html js/perfil.js README.md tests tools/apply_v24.py sql/install/README.md supabase/migrations/20260904122830_v24_consolidacao_seguranca_performance.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix: consolidate V24 security and reliability"
          git push
