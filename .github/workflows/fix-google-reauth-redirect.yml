name: Fix Google deletion reauth redirect

on:
  push:
    paths:
      - '.github/workflows/fix-google-reauth-redirect.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch OAuth reauth redirect
        run: python tools/fix_oauth_redirect.py
      - name: Validate
        run: |
          for f in js/*.js; do node --check "$f"; done
          python tests/smoke.py
      - name: Commit fix
        run: |
          git config user.name "Mendell1"
          git config user.email "matias3.wendell@gmail.com"
          git add js/perfil.js js/google-auth.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: reuse authorized OAuth redirect for account deletion"
          git push
