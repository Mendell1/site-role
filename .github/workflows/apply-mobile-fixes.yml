name: Apply mobile layout fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/mobile-fix-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply mobile patch
        run: python .github/apply_mobile_fix.py

      - name: Commit responsive update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html perfil.html css/mobile-responsive.css js/nav-mobile.js
          git rm .github/mobile-fix-trigger.txt .github/apply_mobile_fix.py .github/workflows/apply-mobile-fixes.yml
          git commit -m "fix: improve mobile navigation and profile layout"
          git push origin main
